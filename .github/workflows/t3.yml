name: t3

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 自检（逻辑坏了要在发通知之前就知道）
        run: node --test 'tests/*.test.mjs'

      - name: 查上游 dist-tag
        id: radar
        run: node scripts/radar.js

      - name: 开 issue
        if: steps.radar.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.radar.outputs.issue_title }}
        run: gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md

      - name: 提交 state
        env:
          STATE_SUMMARY: ${{ steps.radar.outputs.state_summary }}
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git commit -m "chore(state): ${STATE_SUMMARY:-记录上游版本}"
          git push
